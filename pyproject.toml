[project]
name = "subtitle-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["slint>=1.13"]

[project.scripts]
subtitle-cli = "subtitle_app.cli:main"
subtitle-desktop = "subtitle_app.desktop:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1",
]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.1", "numpy>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
